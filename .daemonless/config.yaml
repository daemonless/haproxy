cit:
  mode: port
  port: 80

build:
  variants:
    - tag: "3.4-pkg-latest"
      pkg_name: haproxy
      containerfile: Containerfile.pkg
      args:
        PACKAGES: "haproxy"
        BASE_VERSION: "15.1-latest"
      aliases: ["3.4", "3.4.1", "latest", "pkg", "pkg-latest"]
      default: true
      tag_desc: "HAProxy 3.4 release branch installed from FreeBSD latest packages."

    - tag: "3.3-pkg-latest"
      pkg_name: haproxy33
      containerfile: Containerfile.pkg
      args:
        PACKAGES: "haproxy33"
        BASE_VERSION: "15.1-latest"
      aliases: ["3.3", "3.3.11"]
      tag_desc: "HAProxy 3.3 release branch installed from FreeBSD latest packages."

    - tag: "3.2-pkg-latest"
      pkg_name: haproxy32
      containerfile: Containerfile.pkg
      args:
        PACKAGES: "haproxy32"
        BASE_VERSION: "15.1-latest"
      aliases: ["3.2", "3.2.20", "lts"]
      tag_desc: "HAProxy 3.2 LTS release branch installed from FreeBSD latest packages."

    - tag: "3.0-pkg-latest"
      pkg_name: haproxy30
      containerfile: Containerfile.pkg
      args:
        PACKAGES: "haproxy30"
        BASE_VERSION: "15.1-latest"
      aliases: ["3.0", "3.0.24"]
      tag_desc: "HAProxy 3.0 LTS release branch installed from FreeBSD latest packages."

    - tag: "2.8-pkg-latest"
